env {
  job.mode = "STREAMING"
  parallelism = 4
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
  execution.checkpointing.mode = "AT_LEAST_ONCE"
  execution.checkpointing.externalized-checkpoint-retention = "RETAIN_ON_CANCELLATION"
  execution.checkpointing.tolerable-failed-checkpoints = 3
  table.exec.source.idle-timeout = 5
}

source {
  MySQL-CDC {
    plugin_output = "node_1779331447463_1c6sa57"
    base-url = "jdbc:mysql://mysql.in.wegoab.com:3306/test"
    username = "root"
    password = "truedian#123"
    table-names = ["test.order"]
    server-id = 6189-6199
    startup.mode = "initial"

    # 性能关键参数
    snapshot.fetch.size = 5000
    binlog.batch.size = 500
    poll.interval.ms = 10
    connect.timeout.ms = 10000
    connect.max-retries = 3
    server-time-zone = "Asia/Shanghai"

    debezium {
      snapshot.locking.mode = "none"
      decimal.handling.mode = "double"
      time.precision.mode = "connect"
      include.schema.changes = false

      # Debezium 内部性能调优
      max.queue.size = 8192
      max.batch.size = 2048
      poll.interval.ms = 10
      heartbeat.interval.ms = 500
      event.processing.failure.handling.mode = "ignore"
    }
  }
}

transform {
  SqlLookup {
    plugin = "SqlLookup"
    plugin_input = ["node_1779331447463_1c6sa57"]
    plugin_output = "node_1779331447463_1c6sa57_lookup_0"
    lookup_url = "jdbc:mysql://mysql.in.wegoab.com:3306/wg_tongs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useLegacyDatetimeCode=false"
    lookup_driver = "com.mysql.cj.jdbc.Driver"
    lookup_user = "root"
    lookup_password = "truedian#123"
    lookup_sql = "select tua.c_album_id from tb_user_album tua where tua.c_user_id = ?"
    lookup_cache_id = "tb_user_album_to_albumId"
    lookup_cache_max_size = 10000
    lookup_cache_ttl_seconds = 1800
    source_field = "user_id"
    target_field = "user_id"
  }
  Sql {
    plugin_input = ["node_1779331447463_1c6sa57_lookup_0"]
    plugin_output = "table_node_1779331447463_1c6sa57_to_node_1779331496535_0vl0xys"
    query = "SELECT * FROM node_1779331447463_1c6sa57_lookup_0"
  }
}

sink {
  Jdbc {
    plugin_input = ["table_node_1779331447463_1c6sa57_to_node_1779331496535_0vl0xys"]
    url = "jdbc:mysql://mysql.in.wegoab.com:3306/wangzhijun?useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    password = "truedian#123"
    database = "wangzhijun"
    table = "online_order"
    generate_sink_sql = true
    batch.size = 500
    batch.interval.ms = 100
    max_retries = 3
    is_exactly_once = false
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
