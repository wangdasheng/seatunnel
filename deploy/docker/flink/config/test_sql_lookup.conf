env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    plugin_output = "fake_data"
    row.num = 5
    schema = {
      fields {
        id = int
        name = string
        user_id = string
      }
    }
    rows = [
      {kind=INSERT, id=1, name="Alice", user_id="1001"}
      {kind=INSERT, id=2, name="Bob", user_id="1002"}
      {kind=INSERT, id=3, name="Charlie", user_id="1003"}
      {kind=INSERT, id=4, name="David", user_id="1004"}
      {kind=INSERT, id=5, name="Eve", user_id="1005"}
    ]
  }
}

transform {
  SqlLookup_0 {
    plugin = "SqlLookup"
    source_table_name = "fake_data"
    result_table_name = "lookup_result"
    lookup_url = "jdbc:mysql://mysql.in.wegoab.com:3306/wg_tongs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useLegacyDatetimeCode=false"
    lookup_driver = "com.mysql.cj.jdbc.Driver"
    lookup_user = "root"
    lookup_password = "truedian#123"
    lookup_sql = "select tua.c_album_id from tb_user_album tua where tua.c_user_id = ?"
    lookup_cache_id = "test_lookup_cache"
    lookup_cache_max_size = 10000
    lookup_cache_ttl_seconds = 1800
    source_field = "user_id"
    target_field = "album_id"
  }
}

sink {
  Console {
    source_table_name = "lookup_result"
  }
}
