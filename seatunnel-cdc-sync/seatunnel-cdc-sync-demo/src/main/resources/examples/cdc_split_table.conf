# ============================================================
# Pattern 3: Field-level splitting with rename
# test.cdc_test → wangzhijun.cdc_test_split_basic, split_info, split_detail
# 使用 CdcSplitTableMigrationPlugin 字段拆分 + 字段重命名
# 先执行 cdc_test_ddl.sql 中的建表语句
# ============================================================
env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 10000
}

source {
  MySQL-CDC {
    base-url = "jdbc:mysql://mysql.in.wegoab.com:3306/test?useSSL=false&serverTimezone=Asia/Shanghai"
    username = "root"
    password = "truedian#123"

    table-names = ["test.cdc_test"]
    database-names = ["test"]

    startup.mode = "initial"
    stop.mode = "never"

    server-id = 5400-5404
    decimal.handling.mode = "string"
  }
}

transform {
  CdcSync {
    plugin_class = "org.apache.seatunnel.cdc.sync.demo.CdcSplitTableMigrationPlugin"
    plugin_config {
      target_database = "wangzhijun"
      filter_empty_name = true
      log_every_row = false
      # columns = 源字段名; rename = 可选的 源→目标 字段名映射
      split_mapping = [
        {
          suffix = "_basic",
          columns = ["id", "name", "email", "status"],
          rename  = {email = "contact_email"}   # email 重命名为 contact_email
        }
        {
          suffix = "_info",
          columns = ["id", "age", "score", "created_at"]
          # 无 rename: 目标字段名与源一致
        }
        {
          suffix = "_detail",
          columns = ["id", "email", "created_at", "updated_at"]
        }
      ]
    }
  }
}

sink {
  Jdbc {
    url = "jdbc:mysql://mysql.in.wegoab.com:3306/wangzhijun?useSSL=false&serverTimezone=Asia/Shanghai"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "truedian#123"

    database = "wangzhijun"

    generate_sink_sql = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"

    # 多表写入: cdc_test_split_basic, split_info, split_detail
    support_upsert = true
    primary_keys = ["id"]
  }
}
