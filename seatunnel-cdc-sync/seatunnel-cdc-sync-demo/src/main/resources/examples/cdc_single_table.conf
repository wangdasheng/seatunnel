# ============================================================
# Pattern 1: Single-table migration
# test.cdc_test → wangzhijun.cdc_test
# 使用 CdcTestMigrationPlugin 单表直连
# 先执行 cdc_test_ddl.sql 中的建表语句
# ============================================================
env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 10000
}

source {
  MySQL-CDC {
    base-url = "jdbc:mysql://mysql.in.wegoab.com:3306/test?useSSL=false&serverTimezone=Asia/Shanghai"
    username = "root"
    password = "truedian#123"

    table-names = ["test.cdc_test"]
    database-names = ["test"]

    startup.mode = "initial"
    stop.mode = "never"

    server-id = 5400-5404
    decimal.handling.mode = "string"
  }
}

transform {
  CdcSync {
    # 单表直连插件
    plugin_class = "org.apache.seatunnel.cdc.sync.demo.CdcTestMigrationPlugin"
    plugin_config {
      target_database = "wangzhijun"
      filter_empty_name = true
      log_every_row = false
    }
  }
}

sink {
  Jdbc {
    url = "jdbc:mysql://mysql.in.wegoab.com:3306/wangzhijun?useSSL=false&serverTimezone=Asia/Shanghai"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "truedian#123"

    database = "wangzhijun"
    table = "cdc_test"

    generate_sink_sql = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"

    support_upsert = true
    primary_keys = ["id"]
  }
}
